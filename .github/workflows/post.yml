name: Post to LinkedIn

on:
  schedule:
    # 日本時間 7:50 に起動（GitHub側の混雑で数分〜十数分遅れることがあります）
    - cron: "50 22 * * *"
    # 予備: 日本時間 9:10。朝に失敗・未投稿だった場合の再試行
    - cron: "10 0 * * *"
  push:
    branches: [main]
    paths: ["posts/**"]
  workflow_dispatch:
    inputs:
      post_date:
        description: "投稿する日付 (YYYY-MM-DD)。空欄なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せず、作成した文章の確認だけ行う"
        required: false
        default: "0"

permissions:
  contents: write
  models: read

concurrency:
  group: linkedin-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate post (GitHub Models)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          POST_THEME: ${{ vars.POST_THEME }}
          POST_DATE: ${{ inputs.post_date }}
        run: python generate_post.py

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          POST_DATE: ${{ inputs.post_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python post_to_linkedin.py

      - name: Save post and marker
        if: always() && inputs.dry_run != '1'
        run: |
          if [ -n "$(git status --porcelain posts/ posted/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts/ posted/
            git commit -m "Daily post [skip ci]"
            git pull --rebase
            git push
          fi
